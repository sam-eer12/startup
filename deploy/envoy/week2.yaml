# Synthetic Week 2 response-transform lab; no webhook signature bypass route.
admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9901}
static_resources:
  listeners:
    - name: local_http
      address:
        socket_address: {address: 0.0.0.0, port_value: 8080}
      per_connection_buffer_limit_bytes: 262144
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: local_gateway
                stream_idle_timeout: 5s
                request_headers_timeout: 3s
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: {path: /runtime/bypass}
                          route: {cluster: simulator, timeout: 5s}
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true
                        - match: {prefix: /runtime/}
                          route: {cluster: simulator, timeout: 5s}
                        - match: {prefix: /fixtures/}
                          route: {cluster: simulator, timeout: 5s}
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true
                        - match: {prefix: /}
                          route: {cluster: collector, timeout: 5s}
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: {cluster_name: executor}
                      failure_mode_allow: false
                      message_timeout: 0.025s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: NONE
                        response_body_mode: BUFFERED
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: collector
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: collector, port_value: 8081}
    - name: simulator
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: simulator
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: simulator, port_value: 8082}
    - name: executor
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: executor
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: executor, port_value: 50051}
